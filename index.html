  <style>
    /* Apply the custom cursor to the entire body */
* {
    cursor: url('Normal Select.cur'), auto; 
}





    section {
      background-color: #111827;
    }

    .hover-zoom {
      transition: transform 0.4s ease-in-out;

    .hover-zoom:hover {

    .typewriter h1 {
      overflow: hidden;
      border-right: 3px solid;
      white-space: nowrap;
      margin: 0 auto;
      letter-spacing: 2px;
      animation: typing 3.5s steps(20, end), blink 0.8s infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .wavy-circle {
    --s: 600px; 
    
    width: var(--s); 
    aspect-ratio: 1;
    --g:/calc(var(--s)*0.433) calc(var(--s)*0.433) radial-gradient(50% 50%,#000 99%,#0000 101%) no-repeat;
    mask: calc(50% + var(--s)*0.25) calc(50% + var(--s)*0) var(--g),calc(50% + var(--s)*-0.125) calc(50% + var(--s)*0.217) var(--g),calc(50% + var(--s)*-0.125) calc(50% + var(--s)*-0.217) var(--g),radial-gradient(calc(var(--s)*0.331),#000 99%,#0000 101%) subtract,calc(50% + var(--s)*0.25) calc(50% + var(--s)*0.433) var(--g),calc(50% + var(--s)*-0.5) calc(50% + var(--s)*0) var(--g),calc(50% + var(--s)*0.25) calc(50% + var(--s)*-0.433) var(--g);
  }
    .logo {
      font-size: 2rem;
      font-weight: bold;
      text-transform: uppercase;
      background: linear-gradient(90deg, 
        #A3BFFA, /* Light Blue */
        #7F5AF0, /* Purple */
        #36B6F1, /* Sky Blue */
        #F52FC9, /* Pink */
        #30F5A1, /* Mint Green */
        #36A7FE, /* Ocean Blue */
        #9B6ED0  /* Lavender */
      );
      background-size: 400% 100%;
      background-position: 0% 50%;
      -webkit-background-clip: text;
      color: transparent;
      animation: gradientShift 6s ease infinite;
    }

    /* Keyframes for gradient animation */
    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

<script>
  const colorChangingText = document.querySelector('.color-changing');

let gradientPosition = 0;

// Function to animate the gradient background position
function animateGradient() {
  gradientPosition += 1;
  if (gradientPosition > 100) {
    gradientPosition = 0;
  }

  // Update the background position of the text to create a continuous animation
  colorChangingText.style.backgroundPosition = `${gradientPosition}% 50%`;

  // Repeat the animation
  requestAnimationFrame(animateGradient);
}

// Start the animation loop
animateGradient();
</script>
